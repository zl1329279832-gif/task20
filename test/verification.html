/* ================================================================
 *  测试框架 — 不依赖 DOM 控件, 直接测试核心模块的逻辑
 * ================================================================ */
const T = {
    results: [],   // { group, name, status, msg, detail }
    logs: [],

    group(name) { this._group = name; },

    assert(name, cond, detail = '') {
        const status = cond ? 'pass' : 'fail';
        const msg = cond ? '通过' : '失败';
        this.results.push({ group: this._group, name, status, msg, detail });
        this.log(`[${status.toUpperCase()}] ${this._group} > ${name}: ${msg}${detail ? ' — ' + detail : ''}`);
    },

    info(name, detail = '') {
        this.results.push({ group: this._group, name, status: 'info', msg: '信息', detail });
        this.log(`[INFO] ${this._group} > ${name}: ${detail}`);
    },

    log(msg) {
        this.logs.push(msg);
        const el = document.getElementById('log');
        el.textContent += msg + '\n';
        el.scrollTop = el.scrollHeight;
    },

    render() {
        const groups = {};
        this.results.forEach(r => {
            if (!groups[r.group]) groups[r.group] = [];
            groups[r.group].push(r);
        });
        let html = '';
        for (const [gn, items] of Object.entries(groups)) {
            html += `<div class="test-group"><h2>${gn}</h2>`;
            items.forEach(r => {
                const icon = r.status === 'pass' ? '✓' : r.status === 'fail' ? '✗' : r.status === 'warn' ? '⚠' : 'ℹ';
                html += `<div class="test-item ${r.status}"><span class="icon">${icon}</span><div><span class="msg">${r.name}</span>${r.detail ? `<div class="detail">${r.detail}</div>` : ''}</div></div>`;
            });
            html += '</div>';
        }
        const pass = this.results.filter(r => r.status === 'pass').length;
        const fail = this.results.filter(r => r.status === 'fail').length;
        const info = this.results.filter(r => r.status === 'info').length;
        html += `<div class="summary"><div>测试总结</div><div class="counts"><span style="color:#22c55e">${pass} 通过</span> / <span style="color:#ef4444">${fail} 失败</span> / <span style="color:#60a5fa">${info} 信息</span></div></div>`;
        document.getElementById('results').innerHTML = html;
    }
};

/* ================================================================
 *  辅助: 生成测试数据
 * ================================================================ */
function makeBuildings(ids) {
    return ids.map((id, i) => ({
        building_id: id, building_name: `测试楼栋${i+1}`, location: '测试', floors: 3, area: 5000
    }));
}

function makeReadings(buildingId, meterId, count, startYear, baseEnergy) {
    const readings = [];
    const start = new Date(startYear, 0, 1);
    let reading = 1000;
    for (let i = 0; i < count; i++) {
        const ts = new Date(start.getTime() + i * 86400000);
        const daily = baseEnergy * (0.8 + Math.random() * 0.4);
        reading += daily;
        readings.push({
            meter_id: meterId, timestamp: ts.toISOString(),
            reading: Math.round(reading * 100) / 100,
            energy: Math.round(daily * 100) / 100,
            cost: Math.round(daily * 0.65 * 100) / 100,
            period_type: 'flat', energy_type: 'electricity',
            building_id: buildingId, floor_id: `${buildingId}-F1`
        });
    }
    return readings;
}

/* ================================================================
 *  测试套件 1: Worker-Manager 版本控制
 * ================================================================ */
async function testWorkerManagerVersioning() {
    T.group('1. Worker-Manager 版本控制');

    // 1.1 sessionVersion 初始值
    const wm = new EnergyApp.WorkerManager('./nonexistent-worker.js');
    T.assert('sessionVersion 初始为 0', wm.getSessionVersion() === 0,
        `实际值: ${wm.getSessionVersion()}`);

    // 1.2 bumpSessionVersion 递增
    wm.bumpSessionVersion();
    T.assert('bumpSessionVersion 后 sessionVersion = 1', wm.getSessionVersion() === 1,
        `实际值: ${wm.getSessionVersion()}`);

    // 1.3 bumpQueryId 递增
    const q1 = wm.getQueryId();
    wm.bumpQueryId();
    const q2 = wm.getQueryId();
    T.assert('bumpQueryId 递增', q2 === q1 + 1, `${q1} -> ${q2}`);

    // 1.4 主线程回退也检查版本
    wm.bumpSessionVersion(); // session = 2
    const oldSession = wm.getSessionVersion();
    T.assert('二次 bump 后 sessionVersion = 2', oldSession === 2);

    // 1.5 execute 在主线程模式下, 如果中途 bump 了 session, promise 应 reject
    wm.bumpSessionVersion(); // session = 3
    // 发起一个主线程任务
    const taskPromise = wm.execute('calculateStats', { meterReadings: [], pricing: [], filter: {} });
    // 立即 bump (模拟导入 A 后立即导入 B)
    wm.bumpSessionVersion(); // session = 4
    try {
        await taskPromise;
        T.assert('过期主线程任务被拒绝', false, 'Promise 未拒绝');
    } catch (e) {
        T.assert('过期主线程任务被拒绝', e.message.includes('数据代次过期'),
            `错误: ${e.message}`);
    }

    wm.terminate();
}

/* ================================================================
 *  测试套件 2: 导入 A 后立即导入 B — 数据不串页
 * ================================================================ */
async function testImportSequence() {
    T.group('2. 导入 A 后导入 B — 数据隔离');

    const db = new EnergyApp.DB();
    await db.open();

    // 导入数据集 A: B001, 100条
    const readingsA = makeReadings('B001', 'M-A', 100, 2025, 20);
    await db.clear('meter_readings');
    await db.bulkAdd('meter_readings', readingsA);
    let all = await db.getAll('meter_readings');
    T.assert('导入A: 100条记录入库', all.length === 100,
        `实际: ${all.length}条, building_id=${all[0]?.building_id}`);

    // 立即导入数据集 B: B002, 50条 (覆盖 A)
    const readingsB = makeReadings('B002', 'M-B', 50, 2025, 30);
    await db.clear('meter_readings');
    await db.bulkAdd('meter_readings', readingsB);
    all = await db.getAll('meter_readings');
    T.assert('导入B后: A的数据被清除', all.length === 50,
        `实际: ${all.length}条`);
    T.assert('导入B后: 所有记录属于B002', all.every(r => r.building_id === 'B002'),
        `首条building_id: ${all[0]?.building_id}`);

    // 验证 Calculation 基于当前数据
    const filter = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' };
    const overview = EnergyApp.Calculation.getOverview(all, [], filter);
    T.assert('Calculation 使用当前数据(B)', overview.totalEnergy > 0,
        `totalEnergy=${overview.totalEnergy.toFixed(2)}`);

    // 验证不会残留 A 的数据
    const byBuilding = EnergyApp.Calculation.getByBuilding(all, filter);
    T.assert('聚合结果仅包含 B002', byBuilding.length === 1 && byBuilding[0].building_id === 'B002',
        `楼栋: ${byBuilding.map(b => b.building_id).join(',')}`);

    await db.clear('meter_readings');
}

/* ================================================================
 *  测试套件 3: 快速切换筛选条件 — 只有最新结果有效
 * ================================================================ */
async function testRapidFilterSwitch() {
    T.group('3. 快速切换筛选 — 结果一致性');

    // 准备混合数据
    const readings = [
        ...makeReadings('B001', 'M-1', 100, 2025, 20),
        ...makeReadings('B002', 'M-2', 100, 2025, 30),
        ...makeReadings('B003', 'M-3', 100, 2025, 15),
    ];

    // 3.1 不同楼栋的聚合结果应该不同
    const f1 = { buildingId: 'B001', startDate: '', endDate: '', energyType: 'all' };
    const f2 = { buildingId: 'B002', startDate: '', endDate: '', energyType: 'all' };
    const f3 = { buildingId: 'B003', startDate: '', endDate: '', energyType: 'all' };

    const r1 = EnergyApp.Calculation.getByBuilding(readings, f1);
    const r2 = EnergyApp.Calculation.getByBuilding(readings, f2);
    const r3 = EnergyApp.Calculation.getByBuilding(readings, f3);

    T.assert('B001 聚合独立', r1.length === 1 && r1[0].building_id === 'B001');
    T.assert('B002 聚合独立', r2.length === 1 && r2[0].building_id === 'B002');
    T.assert('B003 聚合独立', r3.length === 1 && r3[0].building_id === 'B003');

    const e1 = r1[0]?.energy || 0;
    const e2 = r2[0]?.energy || 0;
    const e3 = r3[0]?.energy || 0;
    T.assert('三个楼栋能耗各不相同', e1 !== e2 && e2 !== e3 && e1 !== e3,
        `B001=${e1.toFixed(0)}, B002=${e2.toFixed(0)}, B003=${e3.toFixed(0)}`);

    // 3.2 快速连续切换时间段 — 验证每个时间段的计算独立
    const allFilter = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' };
    const janFilter = { ...allFilter, startDate: '2025-01-01', endDate: '2025-01-31' };
    const febFilter = { ...allFilter, startDate: '2025-02-01', endDate: '2025-02-28' };

    const janOverview = EnergyApp.Calculation.getOverview(readings, [], janFilter);
    const febOverview = EnergyApp.Calculation.getOverview(readings, [], febFilter);
    const allOverview = EnergyApp.Calculation.getOverview(readings, [], allFilter);

    T.assert('1月能耗 > 0', janOverview.totalEnergy > 0);
    T.assert('2月能耗 > 0', febOverview.totalEnergy > 0);
    T.assert('全部 >= 1月 + 2月', allOverview.totalEnergy >= janOverview.totalEnergy + febOverview.totalEnergy,
        `全部=${allOverview.totalEnergy.toFixed(0)}, 1月=${janOverview.totalEnergy.toFixed(0)}, 2月=${febOverview.totalEnergy.toFixed(0)}`);

    // 3.3 时间粒度切换
    const monthTrend = EnergyApp.Calculation.getTimeTrend(readings, [], { ...allFilter, timePeriod: 'month' });
    const yearTrend = EnergyApp.Calculation.getTimeTrend(readings, [], { ...allFilter, timePeriod: 'year' });
    T.assert('月度趋势有多个周期', monthTrend.length > 1, `${monthTrend.length}个周期`);
    T.assert('年度趋势周期更少或相等', yearTrend.length <= monthTrend.length,
        `月=${monthTrend.length}, 年=${yearTrend.length}`);

    // 验证趋势总能耗一致
    const trendTotal = monthTrend.reduce((s, t) => s + t.energy, 0);
    const calcTotal = allOverview.totalEnergy;
    T.assert('月度趋势总能耗 ≈ 总览总能耗', Math.abs(trendTotal - calcTotal) < 1,
        `趋势=${trendTotal.toFixed(2)}, 总览=${calcTotal.toFixed(2)}`);
}

/* ================================================================
 *  测试套件 4: 同比/环比使用筛选后数据
 * ================================================================ */
async function testYoYMoMFiltered() {
    T.group('4. 同比/环比 — 使用筛选后数据');

    // 准备跨年数据
    const readings2024 = makeReadings('B001', 'M-1', 365, 2024, 20);
    const readings2025 = makeReadings('B001', 'M-1', 100, 2025, 25);
    const readingsB = makeReadings('B002', 'M-2', 365, 2024, 30);
    const allReadings = [...readings2024, ...readings2025, ...readingsB];

    // 4.1 全部数据的同比
    const allFilter = { buildingId: 'all', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyAll = EnergyApp.Calculation.getYoY(allReadings, allFilter);
    T.assert('全部数据同比: current > 0', yoyAll.current > 0);
    T.assert('全部数据同比: previous > 0', yoyAll.previous > 0,
        `previous=${yoyAll.previous.toFixed(0)}`);

    // 4.2 筛选 B001 后的同比
    const b001Filter = { buildingId: 'B001', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyB001 = EnergyApp.Calculation.getYoY(allReadings, b001Filter);

    // 4.3 筛选 B002 后的同比
    const b002Filter = { buildingId: 'B002', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyB002 = EnergyApp.Calculation.getYoY(allReadings, b002Filter);

    T.assert('B001同比 ≠ B002同比', yoyB001.current !== yoyB002.current || yoyB001.previous !== yoyB002.previous,
        `B001: cur=${yoyB001.current.toFixed(0)}, prev=${yoyB001.previous.toFixed(0)} | B002: cur=${yoyB002.current.toFixed(0)}, prev=${yoyB002.previous.toFixed(0)}`);

    // 4.4 B002 只有2024年数据, 2025年为0
    T.assert('B002 同比: current=0 (2025无数据)', yoyB002.current === 0,
        `current=${yoyB002.current}`);
    T.assert('B002 同比: previous > 0 (2024有数据)', yoyB002.previous > 0,
        `previous=${yoyB002.previous.toFixed(0)}`);

    // 4.5 环比
    const momAll = EnergyApp.Calculation.getMoM(allReadings, allFilter);
    const momB001 = EnergyApp.Calculation.getMoM(allReadings, b001Filter);
    T.assert('环比: 全部和B001不同', momAll.current !== momB001.current || momAll.previous !== momB001.previous,
        `全部: cur=${momAll.current.toFixed(0)}, prev=${momAll.previous.toFixed(0)} | B001: cur=${momB001.current.toFixed(0)}, prev=${momB001.previous.toFixed(0)}`);
}

/* ================================================================
 *  测试套件 5: Storage 数据指纹
 * ================================================================ */
async function testStorageFingerprint() {
    T.group('5. Storage — 数据指纹校验');

    const db = new EnergyApp.DB();
    await db.open();
    const storage = new EnergyApp.Storage(db);

    // 准备数据
    await db.clear('buildings');
    await db.clear('meter_readings');
    await db.bulkAdd('buildings', makeBuildings(['B001', 'B002']));
    await db.bulkAdd('meter_readings', makeReadings('B001', 'M-1', 50, 2025, 20));

    // 5.1 计算指纹
    const fp1 = await storage.computeDataFingerprint();
    T.assert('指纹包含 buildings 信息', fp1.buildings?.count === 2,
        `count=${fp1.buildings?.count}`);
    T.assert('指纹包含 meter_readings 信息', fp1.meter_readings?.count === 50,
        `count=${fp1.meter_readings?.count}`);
    T.assert('指纹包含 buildings.ids', fp1.buildings?.ids === 'B001,B002',
        `ids=${fp1.buildings?.ids}`);

    // 5.2 保存方案(带指纹)
    const filterState = { buildingId: 'B001', startDate: '2025-01-01', endDate: '2025-12-31' };
    const scheme = await storage.saveScheme('测试方案', filterState, '', fp1);
    T.assert('方案保存成功', !!scheme.scheme_id);
    T.assert('方案包含数据指纹', !!scheme.dataFingerprint,
        `有 fingerprint: ${!!scheme.dataFingerprint}`);

    // 5.3 相同数据加载, 指纹匹配
    const fp2 = await storage.computeDataFingerprint();
    const cmp1 = storage.compareFingerprint(fp1, fp2);
    T.assert('相同数据指纹匹配', cmp1.match === true);

    // 5.4 修改数据后, 指纹不匹配
    await db.clear('meter_readings');
    await db.bulkAdd('meter_readings', makeReadings('B001', 'M-1', 80, 2025, 20));
    const fp3 = await storage.computeDataFingerprint();
    const cmp2 = storage.compareFingerprint(fp1, fp3);
    T.assert('数据变更后指纹不匹配', cmp2.match === false,
        `reason: ${cmp2.reason}`);

    // 5.5 恢复方案时能检测到数据变更
    const loadedScheme = await storage.getScheme(scheme.scheme_id);
    const cmp3 = storage.compareFingerprint(loadedScheme.dataFingerprint, fp3);
    T.assert('加载方案可检测到数据变更', cmp3.match === false,
        `reason: ${cmp3.reason}`);

    // 5.6 修改楼栋后, 指纹不匹配
    await db.clear('meter_readings');
    await db.bulkAdd('meter_readings', makeReadings('B001', 'M-1', 50, 2025, 20));
    await db.clear('buildings');
    await db.bulkAdd('buildings', makeBuildings(['B001', 'B003'])); // B002 -> B003
    const fp4 = await storage.computeDataFingerprint();
    const cmp4 = storage.compareFingerprint(fp1, fp4);
    T.assert('楼栋变更后指纹不匹配', cmp4.match === false,
        `reason: ${cmp4.reason}`);

    // 清理
    await storage.deleteScheme(scheme.scheme_id);
    await db.clear('buildings');
    await db.clear('meter_readings');
}

/* ================================================================
 *  测试套件 6: 导出报告一致性
 * ================================================================ */
async function testExportConsistency() {
    T.group('6. 导出报告 — 与看板数据一致');

    const readings = [
        ...makeReadings('B001', 'M-1', 100, 2025, 20),
        ...makeReadings('B002', 'M-2', 100, 2025, 30),
    ];
    const floors = [
        { floor_id: 'B001-F1', building_id: 'B001', floor_number: 1, floor_name: '1F' },
        { floor_id: 'B002-F1', building_id: 'B002', floor_number: 1, floor_name: '1F' },
    ];
    const devices = [
        { device_id: 'D1', device_name: '设备1', meter_id: 'M-1', floor_id: 'B001-F1', device_type: 'electricity' },
        { device_id: 'D2', device_name: '设备2', meter_id: 'M-2', floor_id: 'B002-F1', device_type: 'electricity' },
    ];
    const pricing = [
        { pricing_id: 'P1', period_type: 'flat', start_time: '00:00', end_time: '24:00', price: 0.65 }
    ];

    const filter = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all', timePeriod: 'month' };

    // 6.1 计算所有指标
    const overview = EnergyApp.Calculation.getOverview(readings, pricing, filter);
    const trend = EnergyApp.Calculation.getTimeTrend(readings, pricing, filter);
    const ranking = EnergyApp.Calculation.getDeviceRanking(readings, devices, filter);
    const heatmap = EnergyApp.Calculation.getFloorHeatmap(readings, floors, devices, filter);
    const yoy = EnergyApp.Calculation.getYoY(readings, filter);
    const mom = EnergyApp.Calculation.getMoM(readings, filter);
    const anomalies = EnergyApp.Calculation.detectAnomalies(readings, filter);
    const recommendations = EnergyApp.Calculation.getRecommendations(readings, pricing, filter);

    // 6.2 构建报告数据
    const reportData = {
        overview, trend, ranking, heatmap, yoy, mom, anomalies, recommendations,
        filter: JSON.parse(JSON.stringify(filter)),
        generatedAt: new Date().toLocaleString('zh-CN'),
        _queryId: 1,
        _dataSessionVersion: Date.now()
    };

    // 6.3 生成 HTML 报告
    const html = EnergyApp.Export.generateReport(reportData);
    T.assert('报告生成成功', html.length > 100, `长度: ${html.length}`);
    T.assert('报告包含总能耗', html.includes(Math.round(overview.totalEnergy).toString()) || html.includes(overview.totalEnergy.toFixed(0)),
        `totalEnergy=${overview.totalEnergy.toFixed(0)}`);

    // 6.4 报告中嵌入版本信息
    T.assert('报告包含数据版本', html.includes('数据版本'));
    T.assert('报告包含查询ID', html.includes('查询ID'));
    T.assert('报告包含筛选校验码', html.includes('筛选校验码'));

    // 6.5 同一份数据生成两份报告应一致
    const html2 = EnergyApp.Export.generateReport(reportData);
    // 除了生成时间, 数据部分应一致
    const extractData = (h) => h.replace(/生成时间: [^|]*/g, '生成时间: FIXED');
    T.assert('同一数据两次生成报告一致', extractData(html) === extractData(html2));

    // 6.6 不同筛选条件的报告数据应不同
    const filterB001 = { ...filter, buildingId: 'B001' };

/* ================================================================
 *  测试套件 9: 端到端集成场景
 * ================================================================ */
async function testEndToEnd() {
    T.group('9. 端到端集成 — 完整流程');

    const db = new EnergyApp.DB();
    await db.open();
    const wm = new EnergyApp.WorkerManager('./nonexistent-worker.js');
    const storage = new EnergyApp.Storage(db);

    // === 场景: 导入A -> 保存方案 -> 导入B -> 恢复方案(应警告) -> 导出 ===

    // Step 1: 导入 A
    await db.clear('buildings');
    await db.clear('meter_readings');
    await db.bulkAdd('buildings', makeBuildings(['B001']));
    const readingsA = makeReadings('B001', 'M-A', 200, 2025, 20);
    await db.bulkAdd('meter_readings', readingsA);
    T.assert('E2E Step1: 导入A成功', true);

    // Step 2: 计算并保存方案
    const filterA = { buildingId: 'B001', startDate: '2025-01-01', endDate: '2025-12-31', energyType: 'all', timePeriod: 'month' };
    const fpA = await storage.computeDataFingerprint();
    const scheme = await storage.saveScheme('A方案', filterA, '', fpA);
    T.assert('E2E Step2: 方案保存成功', !!scheme.scheme_id);

    // Step 3: bump session (模拟导入)
    wm.bumpSessionVersion();
    T.assert('E2E Step3: sessionVersion 已推进', wm.getSessionVersion() === 1);

    // Step 4: 导入 B (覆盖 A)
    await db.clear('buildings');
    await db.clear('meter_readings');
    await db.bulkAdd('buildings', makeBuildings(['B002', 'B003']));
    const readingsB = makeReadings('B002', 'M-B', 150, 2025, 35);
    await db.bulkAdd('meter_readings', readingsB);
    T.assert('E2E Step4: 导入B成功', true);

    // Step 5: 恢复方案 — 应检测到数据变更
    const loadedScheme = await storage.getScheme(scheme.scheme_id);
    const fpB = await storage.computeDataFingerprint();
    const cmp = storage.compareFingerprint(loadedScheme.dataFingerprint, fpB);
    T.assert('E2E Step5: 检测到数据已变更', cmp.match === false, cmp.reason);

    // Step 6: 使用 B 的数据计算(不是 A 的)
    const allB = await db.getAll('meter_readings');
    const overviewB = EnergyApp.Calculation.getOverview(allB, [], { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' });
    T.assert('E2E Step6: 看板使用B的数据', overviewB.totalEnergy > 0,
        `totalEnergy=${overviewB.totalEnergy.toFixed(0)}`);
    const byBuilding = EnergyApp.Calculation.getByBuilding(allB, { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' });
    const hasB002 = byBuilding.some(b => b.building_id === 'B002');
    const hasB001 = byBuilding.some(b => b.building_id === 'B001');
    T.assert('E2E Step6: 包含B002', hasB002);
    T.assert('E2E Step6: 不包含B001', !hasB001);

    // Step 7: 导出报告
    const reportData = {
        overview: overviewB,
        trend: EnergyApp.Calculation.getTimeTrend(allB, [], { buildingId: 'all', startDate: '', endDate: '', energyType: 'all', timePeriod: 'month' }),
        ranking: EnergyApp.Calculation.getDeviceRanking(allB, [], { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' }),
        heatmap: [], yoy: { current: 0, previous: 0, change: 0 }, mom: { current: 0, previous: 0, change: 0 },
        anomalies: [], recommendations: [],
        filter: { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' },
        generatedAt: new Date().toLocaleString('zh-CN'),
        _queryId: 1, _dataSessionVersion: wm.getSessionVersion()
    };
    const html = EnergyApp.Export.generateReport(reportData);
    T.assert('E2E Step7: 报告导出成功', html.length > 100);
    T.assert('E2E Step7: 报告使用B的数据', html.includes('B002') || html.includes(overviewB.totalEnergy.toFixed(0)));

    // 清理
    await storage.deleteScheme(scheme.scheme_id);
    await db.clear('buildings');
    await db.clear('meter_readings');
    wm.terminate();
}

/* ================================================================
 *  测试套件 14: 策略对比一致性
 * ================================================================ */
async function testStrategyComparisonConsistency() {
    T.group('14. 策略对比 — 一致性校验');

    const readings = [
        ...makeReadings('B001', 'M-1', 200, 2025, 20),
        ...makeReadings('B002', 'M-2', 200, 2025, 30),
    ];
    const carbonFactors = [
        { factor_id: 'CF1', building_id: 'all', period_type: 'sharp_peak', factor: 1.1 },
        { factor_id: 'CF2', building_id: 'all', period_type: 'peak', factor: 0.9 },
        { factor_id: 'CF3', building_id: 'all', period_type: 'flat', factor: 0.7 },
        { factor_id: 'CF4', building_id: 'all', period_type: 'valley', factor: 0.4 },
    ];
    const filter = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' };

    // 14.1 基线策略: savings 应为 0
    const baselineParams = { load_shift_pct: 0, demand_reduction_pct: 0, device_efficiency_gain: 0, weekend_shutdown_pct: 0 };
    const baselineResult = EnergyApp.Calculation.evaluateStrategy(readings, carbonFactors, [], [], [], filter, baselineParams);
    T.assert('基线策略: 碳减排率 ≈ 0', Math.abs(baselineResult.reductionPct) < 1,
        `reductionPct=${baselineResult.reductionPct.toFixed(2)}%`);
    T.assert('基线策略: 节省成本 ≈ 0', Math.abs(baselineResult.savings.cost) < baselineResult.baseline.totalCost * 0.01,
        `savings.cost=${baselineResult.savings.cost.toFixed(0)}`);

    // 14.2 优化策略: savings > 0
    const optimizedParams = { load_shift_pct: 0.3, demand_reduction_pct: 0.1, device_efficiency_gain: 0.05, weekend_shutdown_pct: 0.4 };
    const optimizedResult = EnergyApp.Calculation.evaluateStrategy(readings, carbonFactors, [], [], [], filter, optimizedParams);
    T.assert('优化策略: 碳减排率 > 0', optimizedResult.reductionPct > 0,
        `reductionPct=${optimizedResult.reductionPct.toFixed(2)}%`);
    T.assert('优化策略: 碳排低于基线', optimizedResult.projected.totalCarbon < baselineResult.baseline.totalCarbon,
        `基线=${baselineResult.baseline.totalCarbon.toFixed(0)}, 预测=${optimizedResult.projected.totalCarbon.toFixed(0)}`);

    // 14.3 同一数据+filter评估多次, 结果一致
    const r1 = EnergyApp.Calculation.evaluateStrategy(readings, carbonFactors, [], [], [], filter, optimizedParams);
    const r2 = EnergyApp.Calculation.evaluateStrategy(readings, carbonFactors, [], [], [], filter, optimizedParams);
    T.assert('多次评估结果一致(碳排)', Math.abs(r1.projected.totalCarbon - r2.projected.totalCarbon) < 0.01,
        `r1=${r1.projected.totalCarbon.toFixed(2)}, r2=${r2.projected.totalCarbon.toFixed(2)}`);
    T.assert('多次评估结果一致(成本)', Math.abs(r1.projected.totalCost - r2.projected.totalCost) < 0.01,
        `r1=${r1.projected.totalCost.toFixed(2)}, r2=${r2.projected.totalCost.toFixed(2)}`);

    // 14.4 参数更大的策略应有更大减排
    const aggressiveParams = { load_shift_pct: 0.5, demand_reduction_pct: 0.2, device_efficiency_gain: 0.1, weekend_shutdown_pct: 0.6 };
    const aggressiveResult = EnergyApp.Calculation.evaluateStrategy(readings, carbonFactors, [], [], [], filter, aggressiveParams);
    T.assert('激进策略减排 > 温和策略减排', aggressiveResult.reductionPct > optimizedResult.reductionPct,
        `激进=${aggressiveResult.reductionPct.toFixed(1)}%, 温和=${optimizedResult.reductionPct.toFixed(1)}%`);

    // 14.5 月度投影数组长度与基线月度一致
    T.assert('月度投影非空', optimizedResult.monthlyProjection.length > 0,
        `${optimizedResult.monthlyProjection.length} 个月`);
    const mpTotal = optimizedResult.monthlyProjection.reduce((s, m) => s + m.baselineCarbon, 0);
    T.assert('月度投影基线碳排 ≈ 总基线碳排', Math.abs(mpTotal - optimizedResult.baseline.totalCarbon) < 1,
        `月度总=${mpTotal.toFixed(0)}, 基线总=${optimizedResult.baseline.totalCarbon.toFixed(0)}`);

    // 14.6 StrategyManager 创建/对比
    const db = new EnergyApp.DB();
    await db.open();
    const storage = new EnergyApp.Storage(db);
    const sm = new EnergyApp.StrategyManager(db, new EnergyApp.WorkerManager('./nonexistent-worker.js'), storage);

    const s1 = await sm.create('基线测试', '', baselineParams, true);
    const s2 = await sm.create('优化测试', '', optimizedParams, false);
    T.assert('策略创建成功', !!s1.strategy_id && !!s2.strategy_id);

    // 清理
    await sm.delete(s1.strategy_id);
    await sm.delete(s2.strategy_id);
    sm.worker.terminate();
}

/* ================================================================
 *  测试套件 15: 快速切换筛选 — YoY/MoM 面板一致性
 * ================================================================ */
async function testRapidFilterYoYMoMConsistency() {
    T.group('15. 快速切换筛选 — YoY/MoM 面板一致性');

    // 准备跨年多楼栋数据
    const readings2024 = [
        ...makeReadings('B001', 'M-1', 365, 2024, 20),
        ...makeReadings('B002', 'M-2', 365, 2024, 30),
        ...makeReadings('B003', 'M-3', 365, 2024, 15),
    ];
    const readings2025 = [
        ...makeReadings('B001', 'M-1', 100, 2025, 22),
        ...makeReadings('B002', 'M-2', 100, 2025, 33),
        ...makeReadings('B003', 'M-3', 100, 2025, 17),
    ];
    const allReadings = [...readings2024, ...readings2025];

    // 15.1 筛选 B001 的 YoY 应仅包含 B001 数据
    const fB001 = { buildingId: 'B001', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyB001 = EnergyApp.Calculation.getYoY(allReadings, fB001);
    // 手动计算 B001 的 2025 能耗
    const b001_2025 = allReadings.filter(r => r.building_id === 'B001' && new Date(r.timestamp).getFullYear() === 2025)
                                  .reduce((s, r) => s + (Number(r.reading) || 0), 0);
    T.assert('YoY(B001): current 仅含 B001', Math.abs(yoyB001.current - b001_2025) < 1,
        `YoY.current=${yoyB001.current.toFixed(0)}, B001_2025=${b001_2025.toFixed(0)}`);

    // 15.2 筛选 B002 的 YoY 与 B001 不同
    const fB002 = { buildingId: 'B002', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyB002 = EnergyApp.Calculation.getYoY(allReadings, fB002);
    T.assert('YoY(B001) ≠ YoY(B002)', yoyB001.current !== yoyB002.current,
        `B001=${yoyB001.current.toFixed(0)}, B002=${yoyB002.current.toFixed(0)}`);

    // 15.3 全部楼栋 YoY >= 任何单楼栋
    const fAll = { buildingId: 'all', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const yoyAll = EnergyApp.Calculation.getYoY(allReadings, fAll);
    T.assert('YoY(全部) >= YoY(B001)', yoyAll.current >= yoyB001.current,
        `全部=${yoyAll.current.toFixed(0)}, B001=${yoyB001.current.toFixed(0)}`);
    T.assert('YoY(全部) >= YoY(B002)', yoyAll.current >= yoyB002.current,
        `全部=${yoyAll.current.toFixed(0)}, B002=${yoyB002.current.toFixed(0)}`);
    T.assert('YoY(全部) ≈ YoY(B001)+YoY(B002)+YoY(B003)',
        Math.abs(yoyAll.current - (yoyB001.current + yoyB002.current + EnergyApp.Calculation.getYoY(allReadings, { buildingId: 'B003', startDate: '', endDate: '2025-04-11', energyType: 'all' }).current)) < 1,
        `全部=${yoyAll.current.toFixed(0)}`);

    // 15.4 MoM 一致性
    const momB001 = EnergyApp.Calculation.getMoM(allReadings, fB001);
    const momB002 = EnergyApp.Calculation.getMoM(allReadings, fB002);
    const momAll = EnergyApp.Calculation.getMoM(allReadings, fAll);
    T.assert('MoM(B001) ≠ MoM(B002)', momB001.current !== momB002.current || momB001.previous !== momB002.previous,
        `B001: cur=${momB001.current.toFixed(0)}, prev=${momB001.previous.toFixed(0)} | B002: cur=${momB002.current.toFixed(0)}, prev=${momB002.previous.toFixed(0)}`);
    T.assert('MoM(全部) >= MoM(B001)', momAll.current >= momB001.current,
        `全部=${momAll.current.toFixed(0)}, B001=${momB001.current.toFixed(0)}`);

    // 15.5 快速切换后每次结果独立 — 模拟 B001→B002→B003→B001
    const fB003 = { buildingId: 'B003', startDate: '', endDate: '2025-04-11', energyType: 'all' };
    const seq = [fB001, fB002, fB003, fB001];
    const results = seq.map(f => EnergyApp.Calculation.getYoY(allReadings, f));
    T.assert('快速切换: 第1次=B001, 第4次=B001, 结果一致',
        Math.abs(results[0].current - results[3].current) < 0.01,
        `第1次=${results[0].current.toFixed(2)}, 第4次=${results[3].current.toFixed(2)}`);
    T.assert('快速切换: B001 ≠ B002', results[0].current !== results[1].current);
    T.assert('快速切换: B002 ≠ B003', results[1].current !== results[2].current);
}

/* ================================================================
 *  测试套件 16: 连续导入 — init() 竞态防护
 * ================================================================ */
async function testConsecutiveImportRace() {
    T.group('16. 连续导入 — init() 竞态防护');

    const db = new EnergyApp.DB();
    await db.open();
    const wm = new EnergyApp.WorkerManager('./nonexistent-worker.js');

    // 模拟 DashboardController 的 _renderId 机制
    let _renderId = 0;
    let lastRenderedData = null;

    async function mockInit(data) {
        const renderId = ++_renderId;
        // 模拟异步 loadData
        await new Promise(resolve => setTimeout(resolve, 10));
        if (renderId !== _renderId) return; // 过期的 init, 中止
        lastRenderedData = data;
    }

    // 16.1 正常单次 init
    await mockInit({ buildings: ['B001'], version: 1 });
    T.assert('单次 init: 数据正确渲染', lastRenderedData?.version === 1,
        `version=${lastRenderedData?.version}`);

    // 16.2 快速连续两次 init — 第一次应被中止
    const initA = mockInit({ buildings: ['B001'], version: 'A' });
    const initB = mockInit({ buildings: ['B002'], version: 'B' });
    await Promise.all([initA, initB]);
    T.assert('连续 init: 最终渲染的是第二次数据', lastRenderedData?.version === 'B',
        `version=${lastRenderedData?.version}`);

    // 16.3 快速连续三次 init — 只有最后一次生效
    const initC = mockInit({ version: 'C' });
    const initD = mockInit({ version: 'D' });
    const initE = mockInit({ version: 'E' });
    await Promise.all([initC, initD, initE]);
    T.assert('三次连续 init: 最终渲染的是第三次数据', lastRenderedData?.version === 'E',
        `version=${lastRenderedData?.version}`);

    // 16.4 bumpSessionVersion 在连续导入间正确递增
    wm.bumpSessionVersion();
    wm.bumpSessionVersion();
    wm.bumpSessionVersion();
    T.assert('三次 bump 后 sessionVersion = 3', wm.getSessionVersion() === 3,
        `实际: ${wm.getSessionVersion()}`);

    // 16.5 连续导入时旧任务全部被拒绝
    wm.bumpSessionVersion();
    const p1 = wm.execute('calculateStats', { meterReadings: [], pricing: [], filter: {} });
    wm.bumpSessionVersion();
    const p2 = wm.execute('calculateStats', { meterReadings: [], pricing: [], filter: {} });
    wm.bumpSessionVersion();
    let rejected1 = false, rejected2 = false;
    try { await p1; } catch (e) { rejected1 = true; }
    try { await p2; } catch (e) { rejected2 = true; }
    T.assert('连续导入: 第一个任务被拒绝', rejected1);
    T.assert('连续导入: 第二个任务被拒绝', rejected2);

    wm.terminate();
}

/* ================================================================
 *  测试套件 17: 低置信度字段映射 — 全数据类型覆盖
 * ================================================================ */
async function testLowConfidenceAllTypes() {
    T.group('17. 低置信度映射 — 全数据类型覆盖');

    const hasLowConf = (mapping) => Object.values(mapping.mapping).some(info => info.confidence < 0.5);

    // 17.1 精确匹配不应触发低置信度
    const preciseHeaders = {
        building: ['building_id', 'building_name', 'location', 'floors', 'area'],
        floor: ['floor_id', 'building_id', 'floor_number', 'floor_name'],
        room: ['room_id', 'floor_id', 'room_name', 'room_type', 'area'],
        device: ['device_id', 'device_name', 'room_id', 'device_type', 'meter_id', 'rated_power', 'building_id', 'floor_id'],
        meter_reading: ['meter_id', 'timestamp', 'reading', 'energy', 'cost', 'period_type', 'energy_type', 'building_id', 'floor_id'],
        carbon_factor: ['factor_id', 'building_id', 'period_type', 'factor', 'effective_date', 'source'],
        demand_pricing: ['demand_pricing_id', 'building_id', 'rate_per_kw', 'billing_period', 'threshold_kw', 'effective_date'],
        migratable_load: ['load_id', 'building_id', 'device_type', 'from_period', 'to_period', 'max_capacity_kwh', 'shift_efficiency'],
    };

    for (const [type, headers] of Object.entries(preciseHeaders)) {
        const map = EnergyApp.Parser.mapFields(headers, type);
        const conf = Object.values(map.mapping).map(m => m.confidence);
        const allHigh = conf.every(c => c >= 0.9);
        T.assert(`精确匹配 ${type}: 全部 >= 0.9`, allHigh,
            `匹配 ${Object.keys(map.mapping).length} 字段, 置信度: ${conf.map(c => c.toFixed(2)).join(', ')}`);
    }

    // 17.2 无关列名应触发低置信度或无映射
    const randomHeaders = ['col_alpha', 'col_beta', 'xyz_123', 'random_data', 'test_field'];
    const lowConfTypes = ['building', 'floor', 'room', 'device', 'meter_reading', 'carbon_factor', 'demand_pricing', 'migratable_load'];
    for (const type of lowConfTypes) {
        const map = EnergyApp.Parser.mapFields(randomHeaders, type);
        const mappedCount = Object.keys(map.mapping).length;
        const low = hasLowConf(map);
        T.assert(`无关列名 ${type}: 无映射或低置信`, mappedCount === 0 || low,
            `匹配 ${mappedCount} 字段, 低置信: ${low}`);
    }

    // 17.3 中文字段名映射 — 主要数据类型
    const chineseHeaders = {
        building: ['楼栋ID', '楼栋名称', '位置', '楼层数', '面积'],
        meter_reading: ['电表编号', '时间戳', '读数', '能耗', '电费', '时段类型', '能源类型', '楼栋ID'],
        carbon_factor: ['因子ID', '楼栋ID', '时段类型', '排放因子', '生效日期'],
    };
    for (const [type, headers] of Object.entries(chineseHeaders)) {
        const map = EnergyApp.Parser.mapFields(headers, type);
        const mappedCount = Object.keys(map.mapping).length;
        T.assert(`中文列名 ${type}: 匹配 >= 3 字段`, mappedCount >= 3,
            `匹配 ${mappedCount} 字段`);
    }
}

/* ================================================================
 *  测试套件 18: Worker 旧回包丢弃 — 全任务类型
 * ================================================================ */
async function testStaleWorkerDiscardAllTypes() {
    T.group('18. 过期回包丢弃 — 全任务类型');

    const wm = new EnergyApp.WorkerManager('./nonexistent-worker.js');
    const readings = makeReadings('B001', 'M-1', 50, 2025, 20);
    const carbonFactors = [{ factor_id: 'CF1', building_id: 'all', period_type: 'flat', factor: 0.7 }];
    const demandPricing = [{ demand_pricing_id: 'DP1', building_id: 'all', rate_per_kw: 45 }];
    const migratableLoads = [{ load_id: 'ML1', building_id: 'B001', from_period: 'flat', to_period: 'valley', max_capacity_kwh: 100, shift_efficiency: 0.95 }];
    const filter = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all' };

    const taskTypes = [
        { type: 'aggregate', payload: { meterReadings: readings, pricing: [], floors: [], devices: [], filter } },
        { type: 'calculateCarbon', payload: { meterReadings: readings, carbonFactors, pricing: [], filter } },
        { type: 'calculateDemandCost', payload: { meterReadings: readings, demandPricing, pricing: [], filter } },
        { type: 'calculateTransferable', payload: { meterReadings: readings, migratableLoads, pricing: [], filter } },
        { type: 'evaluateStrategy', payload: { meterReadings: readings, carbonFactors, demandPricing, migratableLoads, pricing: [], filter, strategyParams: { load_shift_pct: 0.2 } } },
        { type: 'calculateStats', payload: { meterReadings: readings, pricing: [], filter } },
        { type: 'detectAnomalies', payload: { meterReadings: readings, filter } },
    ];

    for (const { type, payload } of taskTypes) {
        wm.bumpSessionVersion();
        const promise = wm.execute(type, payload);
        wm.bumpSessionVersion(); // 中途 bump 使其过期
        try {
            await promise;
            T.assert(`${type}: 过期任务被拒绝`, false, 'Promise 未拒绝');
        } catch (e) {
            T.assert(`${type}: 过期任务被拒绝`,
                e.message.includes('数据') || e.message.includes('过期') || e.message.includes('取消') || e.message.includes('Worker'),
                `错误: ${e.message}`);
        }
    }

    // 18.2 正常任务(不 bump)应成功
    wm.bumpSessionVersion();
    const normalResult = await wm.execute('calculateStats', { meterReadings: readings, pricing: [], filter });
    T.assert('正常 calculateStats 成功', normalResult && normalResult.totalEnergy >= 0,
        `totalEnergy=${normalResult?.totalEnergy?.toFixed(0)}`);

    const normalCarbon = await wm.execute('calculateCarbon', { meterReadings: readings, carbonFactors, pricing: [], filter });
    T.assert('正常 calculateCarbon 成功', normalCarbon && normalCarbon.totalCarbon >= 0,
        `totalCarbon=${normalCarbon?.totalCarbon?.toFixed(0)}`);

    wm.terminate();
}

/* ================================================================
 *  测试套件 19: 方案恢复后导出一致性
 * ================================================================ */
async function testSchemeRestoreExportConsistency() {
    T.group('19. 方案恢复后导出一致性');

    const db = new EnergyApp.DB();
    await db.open();
    const wm = new EnergyApp.WorkerManager('./nonexistent-worker.js');
    const storage = new EnergyApp.Storage(db);

    // Step 1: 导入数据 A (B001, 200条)
    await db.clear('buildings');
    await db.clear('meter_readings');
    await db.bulkAdd('buildings', makeBuildings(['B001']));
    const readingsA = makeReadings('B001', 'M-A', 200, 2025, 20);
    await db.bulkAdd('meter_readings', readingsA);
    wm.bumpSessionVersion();
    T.assert('E2E-S1: 导入A完成', true);

    // Step 2: 计算 A 的指标并保存方案
    const filterA = { buildingId: 'B001', startDate: '2025-01-01', endDate: '2025-12-31', energyType: 'all', timePeriod: 'month' };
    const overviewA = EnergyApp.Calculation.getOverview(readingsA, [], filterA);
    const fpA = await storage.computeDataFingerprint();
    const scheme = await storage.saveScheme('一致性测试方案', filterA, '', fpA);
    T.assert('E2E-S2: 方案保存成功', !!scheme.scheme_id);
    T.assert('E2E-S2: 记录A的能耗', overviewA.totalEnergy > 0, `totalEnergy_A=${overviewA.totalEnergy.toFixed(0)}`);

    // Step 3: 导入数据 B (B002, 150条, 不同能耗)
    wm.bumpSessionVersion();
    await db.clear('buildings');
    await db.clear('meter_readings');
    await db.bulkAdd('buildings', makeBuildings(['B002']));
    const readingsB = makeReadings('B002', 'M-B', 150, 2025, 35);
    await db.bulkAdd('meter_readings', readingsB);
    T.assert('E2E-S3: 导入B完成', true);

    // Step 4: 恢复方案 — 应检测到数据变更
    const loadedScheme = await storage.getScheme(scheme.scheme_id);
    const fpB = await storage.computeDataFingerprint();
    const cmp = storage.compareFingerprint(loadedScheme.dataFingerprint, fpB);
    T.assert('E2E-S4: 指纹检测到数据已变更', cmp.match === false, cmp.reason);

    // Step 5: 使用 B 的数据计算 (看板应使用当前数据)
    const allB = await db.getAll('meter_readings');
    const filterB = { buildingId: 'all', startDate: '', endDate: '', energyType: 'all', timePeriod: 'month' };
    const overviewB = EnergyApp.Calculation.getOverview(allB, [], filterB);
    const trendB = EnergyApp.Calculation.getTimeTrend(allB, [], filterB);
    const rankingB = EnergyApp.Calculation.getDeviceRanking(allB, [], filterB);
    const heatmapB = EnergyApp.Calculation.getFloorHeatmap(allB, [], [], filterB);
    const yoyB = EnergyApp.Calculation.getYoY(allB, filterB);
    const momB = EnergyApp.Calculation.getMoM(allB, filterB);
    const anomaliesB = EnergyApp.Calculation.detectAnomalies(allB, filterB);
    const recommendationsB = EnergyApp.Calculation.getRecommendations(allB, [], filterB);

    T.assert('E2E-S5: B的能耗 > 0', overviewB.totalEnergy > 0, `totalEnergy_B=${overviewB.totalEnergy.toFixed(0)}`);
    T.assert('E2E-S5: B的能耗 ≠ A的能耗', Math.abs(overviewB.totalEnergy - overviewA.totalEnergy) > 1,
        `A=${overviewA.totalEnergy.toFixed(0)}, B=${overviewB.totalEnergy.toFixed(0)}`);

    // Step 6: 导出报告 — 应使用 B 的数据
    const reportData = {
        overview: overviewB, trend: trendB, ranking: rankingB, heatmap: heatmapB,
        yoy: yoyB, mom: momB, anomalies: anomaliesB, recommendations: recommendationsB,
        filter: JSON.parse(JSON.stringify(filterB)),
        generatedAt: new Date().toLocaleString('zh-CN'),
        _queryId: 1, _dataSessionVersion: wm.getSessionVersion()
    };
    const html = EnergyApp.Export.generateReport(reportData);
    T.assert('E2E-S6: 报告生成成功', html.length > 100);

    // 报告应使用 B 的数据(能耗值), 不含 A 的数据
    const containsBEnergy = html.includes(overviewB.totalEnergy.toFixed(0)) || html.includes(Math.round(overviewB.totalEnergy).toString());
    T.assert('E2E-S6: 报告包含B的能耗数据', containsBEnergy,
        `B.totalEnergy=${overviewB.totalEnergy.toFixed(0)}`);

    // Step 7: 验证 YoY/MoM 也使用 B 的数据(筛选一致性)
    const yoyFiltered = EnergyApp.Calculation.getYoY(allB, { ...filterB, buildingId: 'B002' });
    T.assert('E2E-S7: YoY(all) ≈ YoY(B002) (B中只有B002)',
        Math.abs(yoyB.current - yoyFiltered.current) < 1,
        `all=${yoyB.current.toFixed(0)}, B002=${yoyFiltered.current.toFixed(0)}`);

    // Step 8: 策略评估一致性 — 评估应使用 B 的数据
    const carbonFactors = [
        { factor_id: 'CF1', building_id: 'all', period_type: 'flat', factor: 0.7 },
        { factor_id: 'CF2', building_id: 'all', period_type: 'peak', factor: 0.9 },
    ];
    const strategyResult = EnergyApp.Calculation.evaluateStrategy(
        allB, carbonFactors, [], [], [], filterB,
        { load_shift_pct: 0.3, demand_reduction_pct: 0.1, device_efficiency_gain: 0.05, weekend_shutdown_pct: 0.4 }
    );
    T.assert('E2E-S8: 策略基线碳排 > 0 (基于B)', strategyResult.baseline.totalCarbon > 0,
        `碳排=${strategyResult.baseline.totalCarbon.toFixed(0)}`);
    T.assert('E2E-S8: 策略减排率 > 0', strategyResult.reductionPct > 0,
        `减排率=${strategyResult.reductionPct.toFixed(1)}%`);

    // Step 9: filterChecksum 在报告中
    const cs = EnergyApp.Export._filterChecksum(filterB);
    T.assert('E2E-S9: 报告包含筛选校验码', html.includes(cs),
        `校验码=${cs}`);

    // Step 10: 版本信息嵌入
    T.assert('E2E-S10: 报告包含数据版本', html.includes('数据版本'));
    T.assert('E2E-S10: 报告包含查询ID', html.includes('查询ID'));

    // 清理
    await storage.deleteScheme(scheme.scheme_id);
    await db.clear('buildings');
    await db.clear('meter_readings');
    wm.terminate();
}
